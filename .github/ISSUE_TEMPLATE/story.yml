name: Story
description: One story, fully defined before any work starts.
labels: []
body:
  - type: markdown
    id: estimate-note
    attributes:
      value: |
        After filing, add the issue to the project board. Set the board’s **Estimate** field: 1, 2, 3, 5, 8 or 13 story points. Anything larger is an epic: split it into stories.
        Score from the acceptance criteria against similar closed stories, never from felt hours. Progress by effort reads the board field and nothing else (see `docs/project-board.md`).
  - type: textarea
    id: story
    attributes:
      label: Story
      description: As a <who>, I can <what>, so that <why>.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: The spec sections, decisions and research it rests on, and what it depends on.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Numbered, each one testable. A story is not ready until these are complete.
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of done
      value: |
        - Every new test written first and seen red for the stated reason.
        - Every guard mutation-verified, predictions written first.
        - Lint, typecheck, formatting and the zero-warnings gate pass; no retries; one test per case.
        - CI green on the PR head SHA, read step by step by name; merged into `develop` and deployed to dev, verified.
