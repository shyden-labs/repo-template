# Every third-party `uses:` is pinned at the SHA ci.yml pins (supply-chain test).
#
# A pull request into main merges only a frozen release/* cut (issue #86,
# docs/release-cut.md). main is not strict, because each release merge lands
# on main and never on squash-only develop; this job proves instead what
# strict proved: that what lands is exactly what CI tested on develop.
#
# pull_request_target runs the default branch's own copy of this workflow and
# checks out the default branch, never the pull request: the job fetches the
# pull request's merge ref as git data and runs none of its code. It posts
# its verdict as the release-cut commit status on the head, which main
# requires (Shyden's rulings of 2026-10-23 on #86).
name: release-cut
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  statuses: write

# Every run step writes a trace of the lines bash ran (issue #35, scripts/workflow-trace.ts).
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail -c "__workflow_trace=$RUNNER_TEMP/workflow-trace/$GITHUB_JOB; mkdir -p $__workflow_trace; __workflow_trace=$__workflow_trace/$GITHUB_ACTION; sha256sum $0 > $__workflow_trace; grep -c '' $0 >> $__workflow_trace; set -T; trap 'if [[ $BASH_SOURCE == $0 ]]; then echo $LINENO >> $__workflow_trace; fi' DEBUG; source $0" {0}

jobs:
  judge-release-cut:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # The default branch, with every branch's history: the check asks git about origin/develop and origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      # The head ref is text the pull request's author chose: it reaches the shell through env, never through an expression.
      - name: Judge the release cut and post its status
        env:
          # A fork's full name, refused before anything is posted (issue #103); empty once the fork is deleted.
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-cut.ts "$HEAD_REPOSITORY" "$HEAD_REF" "$HEAD_SHA" "$PR_NUMBER"
      # Each run step's line trace, for the workflow-line record (issue #35); kept after a failure too.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}
          path: ${{ runner.temp }}/workflow-trace/
          if-no-files-found: error
          retention-days: 90
