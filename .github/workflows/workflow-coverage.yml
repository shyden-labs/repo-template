# The workflow-coverage check (issue #35, AC5; Shyden 2026-10-27, "a job that
# waits"). On every pull request it waits for every other run on the head and
# on the commit the head branched from to complete, then fails when any
# workflow file leaves more lines unrun on the head than on that base
# (docs/workflow-lines.md). Make `workflow-coverage` a required check on
# develop and main.
#
# Every third-party `uses:` is a full commit SHA with its `# vX.Y.Z` comment.
name: workflow-coverage
on:
  pull_request:

permissions:
  contents: read
  actions: read

# A newer push brings a newer head to measure, so the older measurement stops.
concurrency:
  group: workflow-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Every run step writes a trace of the lines bash ran (issue #35, scripts/workflow-trace.ts).
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail -c "__workflow_trace=$RUNNER_TEMP/workflow-trace/$GITHUB_JOB; mkdir -p $__workflow_trace; __workflow_trace=$__workflow_trace/$GITHUB_ACTION; sha256sum $0 > $__workflow_trace; grep -c '' $0 >> $__workflow_trace; set -T; trap 'if [[ $BASH_SOURCE == $0 ]]; then echo $LINENO >> $__workflow_trace; fi' DEBUG; source $0" {0}

jobs:
  workflow-coverage:
    runs-on: ubuntu-26.04
    # The wait's 40-minute ceiling (scripts/workflow-coverage-check.ts), and five minutes to measure.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Wait for the other runs, then compare workflow lines with the base
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE: origin/${{ github.base_ref }}
        run: |
          base_sha=$(git merge-base "$HEAD_SHA" "$BASE")
          git worktree add --detach "$RUNNER_TEMP/base" "$base_sha"
          node scripts/workflow-coverage-check.ts "$HEAD_SHA" "$base_sha" "$RUNNER_TEMP/base"
      # Each run step's line trace, for the workflow-line record (issue #35); kept after a failure too.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}
          path: ${{ runner.temp }}/workflow-trace/
          if-no-files-found: error
          retention-days: 90
