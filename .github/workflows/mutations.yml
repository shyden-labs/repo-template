# The mutations check (issue #21; Shyden 2026-10-16: "mutation testing is
# vital. we need it", then "it must be run"). On every pull request, with no
# label to opt in: a pull request that adds or changes a non-unit test file
# must carry a mutation file targeting it, and every mutation file it adds or
# changes runs, each row judged against its written prediction
# (docs/mutations.md). Make `mutations` a required check on develop and main.
#
# Every third-party `uses:` is a full commit SHA with its `# vX.Y.Z` comment.
name: mutations
on:
  pull_request:

permissions:
  contents: read

# Every run step writes a trace of the lines bash ran (issue #35, scripts/workflow-trace.ts).
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail -c "__workflow_trace=$RUNNER_TEMP/workflow-trace/$GITHUB_JOB; mkdir -p $__workflow_trace; __workflow_trace=$__workflow_trace/$GITHUB_ACTION; sha256sum $0 > $__workflow_trace; grep -c '' $0 >> $__workflow_trace; set -T; trap 'if [[ $BASH_SOURCE == $0 ]]; then echo $LINENO >> $__workflow_trace; fi' DEBUG; source $0" {0}

jobs:
  mutations:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The exact Node, from the one file Dependabot bumps (#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      - run: npm ci
      - name: Judge the changed tests and run the changed mutation files
        env:
          BASE: origin/${{ github.base_ref }}
        run: node scripts/mutate.ts pr "$BASE"
      # Each run step's line trace, for the workflow-line record (issue #35); kept after a failure too.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}
          path: ${{ runner.temp }}/workflow-trace/
          if-no-files-found: error
          retention-days: 90
