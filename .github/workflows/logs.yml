# The logs suite (docs/logs-suite.md): the checks of the code that writes,
# keeps or replays logs and audit trails. It runs in CI as a prerequisite to a
# release, never on a pull request: a person starts it on the release ref, or
# the release pipeline calls it, and production waits for it to pass.
# Every third-party `uses:` is pinned to a full commit SHA, as in ci.yml.
name: logs
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Every run step writes a trace of the lines bash ran (issue #35, scripts/workflow-trace.ts).
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail -c "__workflow_trace=$RUNNER_TEMP/workflow-trace/$GITHUB_JOB; mkdir -p $__workflow_trace; __workflow_trace=$__workflow_trace/$GITHUB_ACTION; sha256sum $0 > $__workflow_trace; grep -c '' $0 >> $__workflow_trace; set -T; trap 'if [[ $BASH_SOURCE == $0 ]]; then echo $LINENO >> $__workflow_trace; fi' DEBUG; source $0" {0}

jobs:
  logs:
    runs-on: ubuntu-26.04
    # GitHub's default is 360 minutes: a hung step must stop well before.
    # Set it from the suite's measured runs, at most 30.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # One measured limit belongs on this step: set timeout-minutes from the
      # suite's first CI runs once it holds the project's checks.
      - run: npm run test:logs
      # Each run step's line trace, for the workflow-line record (issue #35); kept after a failure too.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}
          path: ${{ runner.temp }}/workflow-trace/
          if-no-files-found: error
          retention-days: 90
