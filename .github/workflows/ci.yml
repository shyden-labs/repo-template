# Every third-party `uses:` is a full 40-hex commit SHA with a trailing
# `# vX.Y.Z` comment. A tag is mutable and can be repointed by anyone who can
# push to that action's repo; the SHA is the only immutable reference. The
# comment is what makes a Dependabot bump reviewable by a human rather than an
# opaque hex swap -- so never remove it, and never let it drift from the SHA.
name: build-and-test
on:
  pull_request:
  push:
    branches: [develop]

# Every run step writes a trace of the lines bash ran (issue #35, scripts/workflow-trace.ts).
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail -c "__workflow_trace=$RUNNER_TEMP/workflow-trace/$GITHUB_JOB; mkdir -p $__workflow_trace; __workflow_trace=$__workflow_trace/$GITHUB_ACTION; sha256sum $0 > $__workflow_trace; grep -c '' $0 >> $__workflow_trace; set -T; trap 'if [[ $BASH_SOURCE == $0 ]]; then echo $LINENO >> $__workflow_trace; fi' DEBUG; source $0" {0}

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      # GitHub opens Dependabot SECURITY fixes against the default branch
      # only; `target-branch` in dependabot.yml steers version updates alone.
      # With any default but develop, every security fix lands outside the
      # develop gate. First step, so a wrong default fails in seconds (issue #46).
      - name: The default branch is develop
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$DEFAULT_BRANCH" != "develop" ]; then
            echo "::error::The default branch is '$DEFAULT_BRANCH', not develop, so Dependabot security fixes open outside the develop gate. Set it in Settings > General > Default branch."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # The static checks (issue #61); .githooks/pre-push runs the same three before every push.
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - run: npm run test:unit
      # Cases that cannot fit the unit limits (docs/unit-limits.md, #92); its one limit is this step's.
      - name: Integration tests
        run: npm run test:integration
        timeout-minutes: 1
      # Each run step's line trace, for the workflow-line record (issue #35); kept after a failure too.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}
          path: ${{ runner.temp }}/workflow-trace/
          if-no-files-found: error
          retention-days: 90

  # Coverage runs apart from the 1 s unit step, measuring every code file, and
  # the record must equal what it measured (issue #32).
  coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
      - run: node scripts/coverage-record.ts check
      # Each run step's line trace, for the workflow-line record (issue #35); kept after a failure too.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}
          path: ${{ runner.temp }}/workflow-trace/
          if-no-files-found: error
          retention-days: 90
