# Measure-then-commit (issue #30; Shyden 2026-10-20/21: never force-push, and
# no CI bot pushes). A session pushes its unpushed commit to a scratch ref,
# refs/floors/<branch>/<short-sha> or refs/visual/<branch>/<short-sha>, which
# is not a branch and so starts no other run, then starts this workflow by
# hand on it. The workflow measures that commit and hands back what to commit
# as an artifact; it can only read the repository and pushes nothing. The
# session folds the artifact into its commit (scripts/fold-record.ts), pushes
# once and deletes the scratch ref. docs/measure-then-commit.md has the steps.
#
# It also runs, with no input, on a scratch branch coverage/<branch>/<sha>
# holding a pull request's finished commit (#35 part 6): a hand-started run is
# stamped with its branch's commit, so the workflow-line check reads this run
# on the pull request's own head. Nothing folds that run's record.
#
# Every third-party `uses:` is a full commit SHA with its `# vX.Y.Z` comment.
name: record
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'The scratch ref holding the commit: refs/floors/<branch>/<sha> or refs/visual/<branch>/<sha>; none when started on a coverage/<branch>/<sha> branch'
        required: false
        type: string

permissions:
  contents: read

# Every run step writes a trace of the lines bash ran (issue #35, scripts/workflow-trace.ts).
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail -c "__workflow_trace=$RUNNER_TEMP/workflow-trace/$GITHUB_JOB; mkdir -p $__workflow_trace; __workflow_trace=$__workflow_trace/$GITHUB_ACTION; sha256sum $0 > $__workflow_trace; grep -c '' $0 >> $__workflow_trace; set -T; trap 'if [[ $BASH_SOURCE == $0 ]]; then echo $LINENO >> $__workflow_trace; fi' DEBUG; source $0" {0}

jobs:
  record:
    runs-on: ubuntu-26.04
    steps:
      # Before anything is checked out: the ref reaches the shell only
      # through env, never spliced into the script.
      - name: Refuse any ref but a scratch ref
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: |
          case "$REF" in
            refs/floors/?*|refs/visual/?*|refs/heads/coverage/?*) echo "recording $REF" ;;
            *) echo "::error title=not a scratch ref::record runs only on refs/floors/*, refs/visual/* or a coverage/* branch, never on $REF"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      # No cache: this runs a commit no review has seen, and a cache it saved
      # would be restored by develop's own runs.
      # The exact Node, from the one file Dependabot bumps (#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: npm ci
      - run: npm run test:coverage
      - name: Record coverage
        env:
          RECORD_RUN: ${{ inputs.ref || github.ref }}
        run: npm run coverage:record
      - name: Gather what to commit
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: |
          mkdir -p record/files
          cp coverage-record.json record/files/
          git rev-parse HEAD > record/sha
          echo "coverage: recorded by run $GITHUB_RUN_ID on $REF" > record/message.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: record
          path: record/
          if-no-files-found: error
      # Each run step's line trace, for the workflow-line record (issue #35); kept after a failure too.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}
          path: ${{ runner.temp }}/workflow-trace/
          if-no-files-found: error
          retention-days: 90
