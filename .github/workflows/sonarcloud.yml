# The SonarCloud quality gate, blocking (issue shyden-labs/repo-template#27; Shyden's ruling of 2026-10-18:
# a scan that does not run fails, and the results are checked, failing the
# workflow when the gate fails; every project adopts it, blocking).
#
# Reusable: a project calls it from its pull-request workflow and makes the
# job a required check (docs/sonarcloud.md has the one-time setup):
#
#   sonarcloud:
#     uses: ./.github/workflows/sonarcloud.yml
#     with:
#       organization: shyden-labs
#       project-key: shyden-labs_<repo>
#     secrets: inherit
#
# The token never shares a job with a dependency install or the branch's own
# code (shyden-labs/repo-template#193): `coverage-report` installs and runs the
# coverage suite holding no secret, and hands on only coverage/lcov.info.
# `sonarcloud` (the required check's name) checks out afresh, runs no npm, reads
# SONAR_TOKEN from the `sonarcloud` environment, fails when it is missing, scans
# that coverage against https://sonarcloud.io, then reads the gate of THAT scan's
# analysis and is green only on OK. The caller still passes its secrets
# (`secrets: inherit`): GitHub resolves an environment secret the caller did not
# pass to an empty string.
# No step skips the scan and succeeds, and nothing swallows a failure
# (tests/unit/workflow-honesty.test.ts).
#
# Every third-party `uses:` is a full commit SHA with its `# vX.Y.Z` comment.
name: sonarcloud
on:
  workflow_call:
    inputs:
      organization:
        required: true
        type: string
      project-key:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: false

permissions: {}

jobs:
  coverage-report:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Node's download, kept between runs under its exact version (shyden-labs/repo-template#224):
      # a Dockerfile bump misses this cache, so the new version downloads.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: ${{ runner.tool_cache }}/node/${{ steps.node.outputs.version }}
          key: node-${{ steps.node.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      - run: node scripts/npm-ci.ts
        timeout-minutes: 10
      - run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  sonarcloud:
    permissions:
      contents: read
      pull-requests: read
    needs: coverage-report
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: sonarcloud
    steps:
      - name: The SonarCloud token is set
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error title=SONAR_TOKEN is missing::Set SONAR_TOKEN in the sonarcloud environment, and as a Dependabot secret for Dependabot pull requests (docs/sonarcloud.md)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-lcov
          path: coverage
      # The verdict reader runs on Node's built-ins alone (tests/unit/sonar-verdict.test.ts).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # No cache in this job: it holds the token, and a cached file could have been written by a job
      # that installs dependencies (shyden-labs/repo-template#224). The scan action checks the
      # signature of the scanner it downloads.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        timeout-minutes: 15
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ inputs.organization }}
            -Dsonar.projectKey=${{ inputs.project-key }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.sources=.
            -Dsonar.tests=tests
            -Dsonar.exclusions=tests/**
            -Dsonar.coverage.exclusions=eslint.config.js,vitest.unit.config.ts
      - name: Read the quality gate of this scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: node scripts/sonar-verdict.ts .scannerwork/report-task.txt
